[boot]
# Enables systemd for service management (Docker, Snap, systemctl)
systemd=true

[automount]
# Disable automatic Windows drive mounts; rely on explicit /etc/fstab entries.
enabled=false
options="metadata,umask=22,fmask=11"
mountFsTab=true

[network]
# Allows WSL to generate network settings automatically
generateHosts=true
generateResolvConf=true

[interop]
# Allows you to launch Windows apps (like 'code .') from Linux
enabled=true
# Adds Windows PATH to Linux (set to false if you want a 'pure' Linux PATH)
appendWindowsPath=false
